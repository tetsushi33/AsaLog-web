{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-6">新しいログを作成</h2>

  <form action="{% url 'logs:create' %}" method="post" class="space-y-6 bg-white p-6 rounded shadow">
    {% csrf_token %}

    <div>
      <label for="date" class="block font-medium">記録日:</label>
      <input type="date" id="date" name="date" value="{{ today|date:'Y-m-d' }}" class="mt-1 p-2 border rounded w-full">
    </div>

    <div>
      <label for="log_text" class="block font-medium">ログ:</label>
      <textarea id="log_text" name="log_text" rows="3" class="mt-1 p-2 border rounded w-full"></textarea>
    </div>

    <div>
      <label for="sleep_time" class="block font-medium">入眠時間:</label>
      <input type="datetime-local" id="sleep_time" name="sleep_time" class="mt-1 p-2 border rounded w-full">
    </div>

    <div>
      <label for="wakeup_time" class="block font-medium">起床時間:</label>
      <input type="datetime-local" id="wakeup_time" name="wakeup_time" class="mt-1 p-2 border rounded w-full">
    </div>

    <div>
      <label class="block font-medium">気分:</label>
      <div class="flex flex-wrap gap-2 mt-1">
        {% for i in "0123456789"|make_list %}
          <label>
            <input type="radio" id="mood{{ i }}" name="mood" value="{{ i }}" {% if i == "5" %}checked{% endif %}>
            {{ i }}
          </label>
        {% endfor %}
      </div>
    </div>

    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">保存</button>
  </form>

  <div class="mt-6">
    <a href="{% url 'logs:index' %}" class="text-blue-500 hover:underline">← ログ一覧に戻る</a>
  </div>
</div>
{% endblock %}
