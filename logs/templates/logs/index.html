{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto">

<!-- カレンダー上部ナビゲーション -->
<div class="flex items-center justify-between mb-6">
  
  <!-- 左側：月選択フォーム -->
  <div>
    <input type="month" id="monthSelect" class="border rounded px-3 py-2">
  </div>


  <!-- 中央：月移動ナビ（← 10月 →） -->
  <div class="flex items-center justify-center gap-4 flex-1">
    <button id="prevMonth"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-400 shadow hover:bg-gray-100 text-lg">
      ←
    </button>
    <span id="currentMonth" class="text-xl font-semibold text-gray-800"></span>
    <button id="nextMonth"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-gray-400 shadow hover:bg-gray-100 text-lg">
      →
    </button>
  </div>

  <!-- 右側：今日ボタン -->
  <button id="todayBtn"
          class="bg-white text-black font-semibold px-4 py-2 rounded border border-gray-400 shadow hover:bg-gray-100">
    今日
  </button>
</div>

  <div id="calendarGrid" class="grid grid-cols-7 gap-px border bg-gray-300 rounded overflow-hidden">
    <div class="bg-gray-100 py-2 font-semibold text-center">日</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">月</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">火</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">水</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">木</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">金</div>
    <div class="bg-gray-100 py-2 font-semibold text-center">土</div>
    <!-- 日付セルは JS で描画 -->
  </div>
</div>

<script>
  // ログ配列（idとdate "YYYY-MM-DD" を含む想定）
  const logs = JSON.parse('{{ latest_log_list_json|escapejs }}');
  const logDateSet = new Set(logs.map(l => l.date));

  // 現在表示中の年月（0=1月〜11=12月）
  let currentYear, currentMonth;

  function ymdString(y, m) { // m: 0-based
    return `${y}-${String(m + 1).padStart(2, '0')}`;
  }

  function setMonth(y, m) {
    // 月がはみ出したら年繰り上げ/下げ
    const d = new Date(y, m, 1);
    currentYear = d.getFullYear();
    currentMonth = d.getMonth();

    // 上部ラベルを更新（例：2025年10月）
    const monthLabel = document.getElementById('monthLabel');
    const fmt = new Intl.DateTimeFormat('ja-JP', { year: 'numeric', month: 'long' });
    monthLabel.textContent = fmt.format(new Date(currentYear, currentMonth, 1));

    // month input も同期
    const monthSelect = document.getElementById('monthSelect');
    monthSelect.value = ymdString(currentYear, currentMonth);

    // 描画
    renderCalendar(currentYear, currentMonth);
  }

  function shiftMonth(delta) {
    setMonth(currentYear, currentMonth + delta);
  }

  // ▼ 先頭に追加：テキスト省略 & ミニ睡眠円グラフSVG
  function truncateHead(s, n = 6) {
    if (!s) return "（未入力）";
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function miniSleepSVG(sleepTime, wakeTime, size = 40) {
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("viewBox", "0 0 100 100");
    svg.classList.add("mx-auto"); // セル中央寄せ

    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", 50);
    circle.setAttribute("cy", 50);
    circle.setAttribute("r", 45);
    circle.setAttribute("fill", "white");
    circle.setAttribute("stroke", "#9ca3af");
    circle.setAttribute("stroke-width", 4);
    svg.appendChild(circle);

    // 睡眠時間が無い場合（null or undefined）
    if (!sleepTime || !wakeTime) {
      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", "50");
      text.setAttribute("y", "55");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", "30");
      text.setAttribute("fill", "#6b7280");
      text.textContent = "未";
      svg.appendChild(text);
      return svg;
    }

    // 時刻を角度に変換
    const sleep = new Date(sleepTime);
    const wake = new Date(wakeTime);
    const sleepAngle = ((sleep.getHours() + sleep.getMinutes() / 60) / 24) * 360 - 90;
    const wakeAngle = ((wake.getHours() + wake.getMinutes() / 60) / 24) * 360 - 90;

    // パスを生成
    const startX = 50 + 45 * Math.cos((sleepAngle * Math.PI) / 180);
    const startY = 50 + 45 * Math.sin((sleepAngle * Math.PI) / 180);
    const endX = 50 + 45 * Math.cos((wakeAngle * Math.PI) / 180);
    const endY = 50 + 45 * Math.sin((wakeAngle * Math.PI) / 180);

    const largeArc = wakeAngle - sleepAngle < 0
      ? wakeAngle - sleepAngle + 360 > 180
      : wakeAngle - sleepAngle > 180;

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${startX} ${startY} A 45 45 0 ${largeArc ? 1 : 0} 1 ${endX} ${endY}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#3b82f6"); // 青
    path.setAttribute("stroke-width", "8");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);

    return svg;
  }

  function getLocalToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function renderCalendar(year, month) {
    const firstDay  = new Date(year, month, 1);
    const lastDay   = new Date(year, month + 1, 0);
    const startWeekDay = firstDay.getDay();
    const totalDays    = lastDay.getDate();
    const todayISO = getLocalToday();  // ← UTCではなくローカル日付で比較

    // ラベルと month input 同期
    currentYear = year;
    currentMonth = month;
    const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    document.getElementById("currentMonth").textContent = `${year}年 ${monthNames[month]}`;
    document.getElementById("monthSelect").value = `${year}-${String(month + 1).padStart(2,'0')}`;

    const calendarGrid = document.getElementById("calendarGrid");

    // ヘッダー以外をクリア
    const children = Array.from(calendarGrid.children);
    children.slice(7).forEach(e => e.remove());

    // ---------- 前月分（先頭の空き） ----------
    const prevLastDate = new Date(year, month, 0); // 前月末
    const prevLastDay  = prevLastDate.getDate();
    for (let i = startWeekDay - 1; i >= 0; i--) {
      const d  = prevLastDay - i;
      const dt = new Date(year, month - 1, d);
      const cellDate = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const hasLog = logDateSet.has(cellDate);

      // 例：当月ブロック
      const cell = document.createElement("div");
      cell.className = "relative group h-24 p-2 text-sm border text-left transition-colors";

      const dateLabel = document.createElement("div");
      dateLabel.className = "font-semibold mb-1 inline-block text-left text-gray-500";
      dateLabel.textContent = d;
      cell.appendChild(dateLabel);

      // 今日バッジ（前月セルでも該当日なら付ける）
      if (cellDate === todayISO) {
        const badge = document.createElement("div");
        badge.textContent = "today";
        badge.className = "absolute top-1 right-1 bg-black text-white text-[10px] px-1.5 py-0.5 rounded";
        cell.appendChild(badge);
      }

      if (hasLog) {
        const rec = logs.find(l => l.date === cellDate);
        const ymd = cellDate.replace(/-/g, "");
        const link = document.createElement("a");
        link.href = `/logs/${ymd}/`;
        link.className = "block no-underline text-gray-600";

        const topRow = document.createElement("div");
        topRow.className = "flex items-center justify-center mb-1";
        const mini = miniSleepSVG(rec?.sleep_time, rec?.wakeup_time);
        if (mini) topRow.appendChild(mini);

        const good = document.createElement("div");
        good.className = "text-xs text-gray-600 text-center";
        good.textContent = truncateHead(rec?.good_1, 6);

        link.appendChild(topRow);
        link.appendChild(good);
        cell.appendChild(link);
      }
      calendarGrid.appendChild(cell);
    }

    // ---------- 当月 ----------
    for (let day = 1; day <= totalDays; day++) {
      const cellDate = `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const hasLog = logDateSet.has(cellDate);
      const weekday = new Date(year, month, day).getDay();

      // 例：当月ブロック
      const cell = document.createElement("div");
      cell.className = "relative group h-24 p-2 text-sm border text-left transition-colors";

      if (weekday === 0)       cell.classList.add("bg-red-50");
      else if (weekday === 6)  cell.classList.add("bg-blue-50");
      else                     cell.classList.add("bg-white");

      const dateLabel = document.createElement("div");
      dateLabel.className = "font-semibold mb-1 inline-block text-left text-gray-800";
      dateLabel.textContent = day;
      cell.appendChild(dateLabel);

      // 今日バッジ（右上）
      if (cellDate === todayISO) {
        const badge = document.createElement("div");
        badge.textContent = "today";
        badge.className = "absolute top-1 right-1 bg-black text-white text-[10px] px-1.5 py-0.5 rounded";
        cell.appendChild(badge);
      }

      if (hasLog) {
        const rec = logs.find(l => l.date === cellDate);
        const ymd = cellDate.replace(/-/g, "");
        const link = document.createElement("a");
        link.href = `/logs/${ymd}/`;
        link.className = "block no-underline text-gray-800";

        const topRow = document.createElement("div");
        topRow.className = "flex items-center justify-center mb-1";
        const mini = miniSleepSVG(rec?.sleep_time, rec?.wakeup_time);
        if (mini) topRow.appendChild(mini);

        const good = document.createElement("div");
        good.className = "text-xs text-gray-700 text-center";
        good.textContent = truncateHead(rec?.good_1, 6);

        link.appendChild(topRow);
        link.appendChild(good);
        cell.appendChild(link);
      } else {
        // 当月のみ新規作成ボタンを出す
        const plus = document.createElement("a");
        plus.href = `{% url 'logs:create' %}?date=${cellDate}`;
        plus.title = `${cellDate} のログを作成`;
        plus.className = "absolute top-1 right-1 w-6 h-6 grid place-items-center rounded-full bg-green-500 text-white text-base leading-none hover:bg-green-600 shadow";
        plus.textContent = "+";
        cell.appendChild(plus);
      }

      const overlay = document.createElement("div");
      overlay.className = "pointer-events-none absolute inset-0 bg-gray-200 opacity-0 group-hover:opacity-30 transition-opacity";
      cell.appendChild(overlay);

      calendarGrid.appendChild(cell);
    }

    // ---------- 翌月分（末尾の空き） ----------
    const lastWeekDay = lastDay.getDay();
    const tail = 6 - lastWeekDay;
    for (let i = 1; i <= tail; i++) {
      const dt = new Date(year, month + 1, i);
      const cellDate = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      const hasLog = logDateSet.has(cellDate);

      // 例：当月ブロック
      const cell = document.createElement("div");
      cell.className = "relative group h-24 p-2 text-sm border text-left transition-colors";

      const dateLabel = document.createElement("div");
      dateLabel.className = "font-semibold mb-1 inline-block text-left text-gray-500";
      dateLabel.textContent = i;
      cell.appendChild(dateLabel);

      // 今日バッジ（翌月セルでも該当日なら付ける）
      if (cellDate === todayISO) {
        const badge = document.createElement("div");
        badge.textContent = "today";
        badge.className = "absolute top-1 right-1 bg-black text-white text-[10px] px-1.5 py-0.5 rounded";
        cell.appendChild(badge);
      }

      if (hasLog) {
        const rec = logs.find(l => l.date === cellDate);
        const ymd = cellDate.replace(/-/g, "");
        const link = document.createElement("a");
        link.href = `/logs/${ymd}/`;
        link.className = "block no-underline text-gray-600";

        const topRow = document.createElement("div");
        topRow.className = "flex items-center justify-center mb-1";
        const mini = miniSleepSVG(rec?.sleep_time, rec?.wakeup_time);
        if (mini) topRow.appendChild(mini);

        const good = document.createElement("div");
        good.className = "text-xs text-gray-600 text-center";
        good.textContent = truncateHead(rec?.good_1, 6);

        link.appendChild(topRow);
        link.appendChild(good);
        cell.appendChild(link);
      }
      calendarGrid.appendChild(cell);
    }
  }



  function filterCalendarByMonth(value) {
    const [year, month] = value.split("-").map(Number);
    renderCalendar(year, month - 1);
  } 

  // ← → ボタン動作
  document.addEventListener("DOMContentLoaded", () => {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();

    document.getElementById("monthSelect").value =
      `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
    renderCalendar(currentYear, currentMonth);

    document.getElementById("prevMonth").addEventListener("click", () => {
      let y = currentYear, m = currentMonth - 1;
      if (m < 0) { m = 11; y--; }
      renderCalendar(y, m);
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      let y = currentYear, m = currentMonth + 1;
      if (m > 11) { m = 0; y++; }
      renderCalendar(y, m);
    });

    // ✅ 今日ボタン：現在の日付が属する月へ移動
    document.getElementById("todayBtn").addEventListener("click", () => {
      const now = new Date();
      renderCalendar(now.getFullYear(), now.getMonth());
    });
  });
</script>
{% endblock %}
