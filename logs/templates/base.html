<!-- base.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}AsaLog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- バナー -->
  <div class="bg-green-500 text-white">
    <div class="container mx-auto flex justify-between items-center p-4">
      <!-- 左側: アプリ名 -->
      <div class="text-2xl font-bold">
        俺の毎日ログ
      </div>
      <!-- 右側: ボタン -->
      <div class="flex space-x-4">
        <a href="/logs/" class="bg-white text-green-500 px-4 py-2 rounded shadow hover:bg-gray-100">
          🗓️ カレンダー
        </a>
        <a href="{% url 'logs:analyze' %}" class="bg-white text-green-500 px-4 py-2 rounded shadow hover:bg-gray-100">
          📊 分析
        </a>
      </div>
    </div>
  </div>

  <div class="container mx-auto p-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
